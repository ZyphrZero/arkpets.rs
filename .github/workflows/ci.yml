name: Rust
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev mesa-vulkan-drivers xvfb xauth openbox x11-utils x11-xserver-utils xdotool xcompmgr imagemagick wmctrl
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release --bin arkpets-ui
      - name: Linux shell visibility and animation
        if: runner.os == 'Linux'
        run: bash docs/scripts/Verify-ShellVisibility-Linux.sh target/release/arkpets-ui target/linux-shell
