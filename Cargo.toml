[package]
name = "arkpets"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Cross-platform Rust core for Arknights desktop pets"
license = "GPL-3.0-only"
default-run = "arkpets-ui"

[features]
default = ["ui"]
spine = ["dep:cc"]
ui = ["spine", "dep:eframe", "dep:egui-winit", "dep:wgpu", "dep:image", "dep:egui-phosphor", "dep:x11rb", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:dispatch2"]

[[bin]]
name = "arkpets-ui"
path = "src/bin/arkpets-ui.rs"
required-features = ["ui"]

[[example]]
name = "verify-macos-shell-visibility"
path = "docs/scripts/verify_macos_shell_visibility.rs"
required-features = ["ui"]

[[example]]
name = "verify-macos-menu-bar"
path = "docs/scripts/verify_macos_menu_bar.rs"
required-features = ["ui"]

[[example]]
name = "verify-macos-menu-lifecycle"
path = "docs/scripts/verify_macos_menu_lifecycle.rs"
required-features = ["ui"]

[[example]]
name = "verify-macos-drag"
path = "docs/scripts/verify_macos_drag.rs"
required-features = ["ui"]

[[example]]
name = "verify-macos-preview"
path = "docs/scripts/verify_macos_preview.rs"
required-features = ["ui"]

[[example]]
name = "verify-macos-opacity"
path = "docs/scripts/verify_macos_opacity.rs"
required-features = ["ui"]

[[example]]
name = "verify-macos-behavior"
path = "docs/scripts/verify_macos_behavior.rs"
required-features = ["ui"]

[[example]]
name = "verify-macos-effects"
path = "docs/scripts/verify_macos_effects.rs"
required-features = ["ui"]

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["default_fonts", "x11", "wayland", "persistence"] }
egui-winit = { version = "0.36.2", optional = true, default-features = false }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
egui-phosphor = { version = "0.14", optional = true }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["glow", "wgpu_no_default_features"] }
wgpu = { version = "30", optional = true, default-features = false, features = ["dx12"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3.1", optional = true, default-features = false, features = ["std", "objc2"] }
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSData", "NSObject", "NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSCell", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSEvent", "NSScreen", "objc2-core-foundation"] }
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", optional = true, default-features = false, features = ["metal"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", optional = true, default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

[profile.release]
lto = "thin"
codegen-units = 1
