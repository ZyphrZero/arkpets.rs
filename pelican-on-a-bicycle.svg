  <!-- A few small accents keep the ride light and breezy. -->
  <g stroke="#D1AD57" stroke-width="3" stroke-linecap="round">
    <path d="M670 350L676 340M686 361L698 357"/>
  </g>
  <g fill="#9DB398">
    <ellipse cx="345" cy="723" rx="4" ry="2"/>
    <ellipse cx="591" cy="723" rx="6" ry="2"/>
    <ellipse cx="749" cy="713" rx="3" ry="2"/>
  </g>
</svg>
