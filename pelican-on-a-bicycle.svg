  <g stroke="#29474D" stroke-linecap="round" stroke-linejoin="round">
    <path d="M405 431L381 501Q378 507 383 514L420 602" stroke-width="18"/>
    <path d="M405 431L381 501Q378 507 383 514L420 602" stroke="#F5B74F" stroke-width="11"/>
    <path d="M416 597C421 594 427 598 429 604L447 608L458 621H414C404 616 407 603 416 597Z" fill="#F5B74F" stroke-width="4"/>
