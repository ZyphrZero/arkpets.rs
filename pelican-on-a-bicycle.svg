    <circle cx="690" cy="585" r="6" fill="#FFF6DD" stroke-width="3"/>
    <circle cx="622" cy="382" r="10" fill="#F4CB6D" stroke-width="3"/>
    <path d="M618 378L622 376" stroke="#FFFAE0" stroke-width="3"/>
  </g>

