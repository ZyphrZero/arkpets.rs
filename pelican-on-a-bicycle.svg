  <path fill="#FFFBEF" d="M0 0H960V800H0z"/>
  <path d="M153 459C111 327 201 164 349 119C483 79 698 119 790 252C874 373 840 556 731 642C624 726 411 705 286 645C221 614 177 535 153 459Z" fill="url(#sky)"/>
  <circle cx="730" cy="174" r="46" fill="#F8D57B"/>
  <circle cx="730" cy="174" r="61" stroke="#F8D57B" stroke-opacity=".4" stroke-width="2" stroke-dasharray="3 12" stroke-linecap="round"/>
  <g fill="#FFFEF8">
    <path d="M193 251C176 251 173 229 188 223C189 202 218 194 232 213C247 201 268 212 268 229C289 226 297 251 274 251Z"/>
    <path d="M634 342C619 342 616 324 630 318C630 301 651 293 663 307C679 296 698 306 698 319C715 319 722 342 704 342Z"/>
  </g>
  <g stroke="#83AFA8" stroke-width="3" stroke-linecap="round">
    <path d="M331 177Q341 166 351 177Q361 167 371 177"/>
    <path d="M789 289Q797 281 805 289Q813 281 821 289"/>
  </g>
  <ellipse cx="478" cy="704" rx="312" ry="19" fill="#DCE5CD"/>
  <path d="M137 705H821" stroke="#A4B9A2" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#88AA8B" stroke-width="3" stroke-linecap="round">
    <path d="M154 704L151 687M154 704L165 692M804 704L811 682M804 704L796 690"/>
  </g>
  <g stroke="#A4C7BA" stroke-width="5" stroke-linecap="round">
    <path d="M154 397H225M131 420H204M163 443H218"/>
    <path d="M107 420H112"/>
  </g>

