<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" fill="none" role="img" aria-labelledby="title description">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="description">一只系着青绿色围巾的白色鹈鹕，伸展翅膀扶住车把，蹬着珊瑚红色自行车。它有长长的金黄色鸟喙和饱满的喉囊，身后是柔和的天空、云朵和阳光。</desc>

  <defs>
    <linearGradient id="sky" x1="480" y1="102" x2="480" y2="694" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E3F2ED"/>
      <stop offset="1" stop-color="#F1F5DF"/>
    </linearGradient>
    <linearGradient id="pouch" x1="642" y1="211" x2="642" y2="294" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC967"/>
      <stop offset="1" stop-color="#F3A444"/>
    </linearGradient>
    <g id="wheel" stroke="#29474D" stroke-linecap="round" stroke-linejoin="round">
      <circle r="108" fill="#FFFEF6" fill-opacity=".68" stroke-width="13"/>
      <circle r="96" stroke="#9AB7AF" stroke-width="3"/>
      <g stroke="#A6BAB1" stroke-width="2.5">
        <path d="M0-93V93M-93 0H93M-66-66L66 66M-66 66L66-66M-36-86L36 86M-86-36L86 36M-86 36L86-36M-36 86L36-86"/>
      </g>
      <circle r="12" fill="#E1E7D9" stroke-width="4"/>
      <path d="M-73-69A101 101 0 0 1 46-90" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="3"/>
    </g>
  </defs>

