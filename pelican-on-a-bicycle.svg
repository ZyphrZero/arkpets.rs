    <path d="M581 223C590 254 611 274 640 276C678 277 718 259 745 240" stroke="#FFD990" stroke-width="4"/>
    <path d="M559 193C612 191 705 204 776 217C786 219 790 225 782 232C778 235 773 235 770 231L563 217C553 214 551 203 559 193Z" fill="#F9BF50" stroke-width="5"/>
    <path d="M578 205C637 207 704 215 756 221" stroke="#FFE098" stroke-width="4"/>
    <path d="M776 219Q785 221 781 229" stroke="#D88932" stroke-width="3"/>
    <circle cx="548" cy="182" r="13" fill="#FFFFFF" stroke-width="3"/>
    <ellipse cx="552" cy="183" rx="5.5" ry="7" fill="#29474D" stroke="none"/>
    <circle cx="554" cy="180" r="2" fill="#FFFFFF" stroke="none"/>
    <path d="M536 162Q544 158 552 162" stroke-width="3"/>
    <ellipse cx="538" cy="208" rx="9" ry="5" fill="#F0B8A0" stroke="none" opacity=".65"/>

    <!-- The scarf trails behind, while the near wing reaches the handlebar. -->
    <path d="M494 289C465 285 453 263 425 268L436 282L415 289C444 305 466 299 491 308Z" fill="#278E8B" stroke-width="4"/>
    <path d="M490 297C464 303 448 316 426 312L437 328L422 339C454 342 479 320 500 311Z" fill="#44AAA0" stroke-width="4"/>
    <path d="M484 283C501 292 526 295 546 285L549 308C530 320 501 315 486 307Z" fill="#44AAA0" stroke-width="4"/>
    <path d="M496 296Q516 304 537 299" stroke="#A4D8BE" stroke-width="3"/>
    <path d="M361 353C389 333 426 346 457 366C492 389 532 395 565 386L605 375C616 372 626 375 630 382C634 390 625 397 614 400C629 400 626 411 614 415C596 420 574 414 559 415C513 426 458 419 414 404C386 395 364 379 361 353Z" fill="#FFFEF3" stroke-width="5"/>
    <path d="M380 359C402 360 424 382 454 391C493 405 529 407 559 402" stroke="#BBC9BD" stroke-width="3"/>
    <path d="M590 389L615 385M595 402L614 400" stroke="#BBC9BD" stroke-width="3"/>
    <path d="M334 379Q336 390 344 397M344 371Q346 382 354 389" stroke="#C3CDBF" stroke-width="3"/>
